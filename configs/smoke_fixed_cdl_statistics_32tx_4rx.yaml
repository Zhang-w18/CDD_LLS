  common_random_numbers: true
  save_trial_metrics: true

variants:
  - variant_id: baseline
    transmission: {tx_scheme: BASELINE}
  - variant_id: polarization_cycling
    transmission: {tx_scheme: POLARIZATION_CYCLING}
  - variant_id: beam_cycling
    transmission: {tx_scheme: BEAM_CYCLING}
  - variant_id: beam_cdd
