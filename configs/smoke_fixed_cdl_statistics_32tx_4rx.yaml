  bs_horizontal_spacing_lambda: 0.5
  bs_antenna_pattern: 38.901
  bs_polarization_type: cross
  ue_vertical_elements: 1
  ue_horizontal_elements: 2
  ue_polarizations: 2
  ue_vertical_spacing_lambda: 0.5
  ue_horizontal_spacing_lambda: 0.5
